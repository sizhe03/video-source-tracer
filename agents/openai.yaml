interface:
  display_name: video source tracer
  short_description: Trace a video's original creator and original upload across platforms
    from a URL, short link, clip, screenshot, title or incomplete credit. Use for
    找原作者、找原视频、查出处、搬运来源、同视频转载 and reverse video search on Bilibili, YouTube, Douyin,
    Xiaohongshu, TikTok, Instagram, X and other platforms. Inspect repost descriptions
    and nested comments, expand partial names, and verify content and creator attribution
    separately.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
